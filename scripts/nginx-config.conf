server {
    listen 80;
    listen [::]:80;

    server_name _;

    # Serve from the browser folder (Angular SSR build structure)
    root /var/www/CarShield-Projects/browser;
    index index.html;

    # Angular routing: send all non-file requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss application/xhtml+xml application/xml image/svg+xml text/xml application/x-font-ttf application/vnd.ms-fontobject font/opentype;
    gzip_proxied any;
    gzip_comp_level 6;
}
