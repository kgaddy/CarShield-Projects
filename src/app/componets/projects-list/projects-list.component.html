<div class="table-responsive">
    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <th>Status</th>
                <th>Name</th>
                <th>Progress</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let project of projects">
                <td>
                    <span class="badge rounded-pill {{ProjectStatus.getStatusStyle(project.status)}}">
                        {{ ProjectStatus.toDisplayString(project.status) }}
                    </span>
                </td>
                <td>
                    <a *ngIf="project.id;" [routerLink]="['/projectDetail', project.id]">
                        {{ project.name }}
                    </a>
                </td>
                <td>{{ project.percentComplete }}% complete</td>

            </tr>
        </tbody>
    </table>
</div>
