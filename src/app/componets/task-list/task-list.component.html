<div *ngIf="projectTasks.length === 0;">
    <p>No Tasks found.</p>
</div>
<div *ngIf="projectTasks.length > 0;">
    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <th>Title</th>
                <th>Status</th>
                <th>Assigned To</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let task of projectTasks">
                <td>
                    <a *ngIf="task.id;" [routerLink]="['/task',task?.projectId, task?.id]">
                        {{ task.title }}
                    </a>
                </td>
                <td>{{ TaskStatus.toDisplayString(task.status) }}</td>
                <td>{{ task.assignedToDisplayName }}</td>

            </tr>
        </tbody>
    </table>
</div>
