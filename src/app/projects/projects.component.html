<div class="container projects-container">
  <h1>Projects</h1>

  <div *ngIf="projects$ | async as projects; else loading">
    <div *ngIf="projects.length === 0; else projectList">
      <p>No projects found.</p>
    </div>


    <ng-template #projectList>
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th>Status</th>
              <th>Description</th>
              <th>Created By</th>
              <th>Progress</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let project of projects">
              <td>
                <span class="badge rounded-pill {{ProjectStatus.getStatusStyle(project.status)}}">
                  {{ ProjectStatus.toDisplayString(project.status) }}
                </span>
              </td>
              <td>
                <a *ngIf="project.id;" [routerLink]="['/project', project.id]">
                  {{ project.name }}
                </a>
              </td>
              <td>{{ project.createdByDisplayName }}</td>
              <td>{{ project.percentComplete }}% complete</td>
              <td>
                <button *ngIf="canEdit(project)" class="btn btn-sm btn-primary">Edit</button>
                <span *ngIf="project.createdBy === (currentUser$ | async)?.id" class="text-muted ms-2">
                </span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </ng-template>

  </div>


  <ng-template #loading>
    <p>Loading projects...</p>
  </ng-template>
</div>
