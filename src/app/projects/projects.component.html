<div class="container projects-container">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Projects</h1>
    <button class="btn btn-primary" [routerLink]="['/addProject']">
      Add Project
    </button>
  </div>

  <div *ngIf="projects$ | async as projects; else loading">
    <div *ngIf="projects.length === 0; else projectList">
      <p>No projects found.</p>
    </div>


    <ng-template #projectList>
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead>
            <tr>
              <th>Status</th>
              <th>Description</th>
              <th>Created By</th>
              <th>Progress</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let project of projects">
              <td>
                <span class="badge rounded-pill {{ProjectStatus.getStatusStyle(project.status)}}">
                  {{ ProjectStatus.toDisplayString(project.status) }}
                </span>
              </td>
              <td>
                <a *ngIf="project.id;" [routerLink]="['/projectDetail', project.id]">
                  {{ project.name }}
                </a>
              </td>
              <td>{{ project.createdByDisplayName }}</td>
              <td>{{ project.percentComplete }}% complete</td>
              <td>
                <button *ngIf="canEdit(project)" class="btn btn-sm btn-primary me-2"
                  [routerLink]="['/project-form', project.id]">
                  Edit
                </button>

                <button *ngIf="canEdit(project)" class="btn btn-sm btn-danger"
                  (click)="onDeleteProject(project.id)">Delete</button>

              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </ng-template>

  </div>


  <ng-template #loading>
    <p>Loading projects...</p>
  </ng-template>
</div>
