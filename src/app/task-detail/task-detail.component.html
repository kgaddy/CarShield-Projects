
<div class="container">
    <p *ngIf="isLoading">Loading task...</p>
    <p *ngIf="errorMessage">{{ errorMessage }}</p>
    <h1>{{projectTask?.title}}</h1>
    <ul class="list-group">
        <li class="list-group-item">{{projectTask?.assignedToDisplayName}}</li>
        <li class="list-group-item">{{projectTask?.description}}</li>
    </ul>
</div>
